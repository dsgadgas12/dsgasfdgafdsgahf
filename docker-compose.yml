services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn","main:app","--host","0.0.0.0","--port","8000"]
    env_file: .env
    volumes:
      - cloudegift-data:/app/backend/data
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python","/app/bot/bot.py"]
    env_file: .env
    volumes:
      - cloudegift-data:/app/backend/data
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_ADMIN_IDS: ${VITE_ADMIN_IDS}
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  cloudegift-data:
  caddy-data:
  caddy-config:
